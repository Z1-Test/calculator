<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StayCalc</title>
    <meta name="description" content="Fast, distraction-free calculation interface built with W3C Custom Elements and Staylook design tokens." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Anti-flicker early theme synchronization
      (function() {
        try {
          var mode = localStorage.getItem('staycalc_theme');
          var isDark = mode === 'dark' || (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <stay-calc-app>
      <template shadowrootmode="open">
        <style>
          :host {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--sl-space-md, 16px);
            box-sizing: border-box;
            background-color: var(--sl-background, #ffffff);
          }
          .calculator-shell {
            width: 100%;
            max-width: 380px;
            background-color: var(--sl-surface, #f4f4f5);
            border: 1px solid var(--sl-outline-low, #e4e4e7);
            border-radius: var(--sl-radius-lg, 16px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
          }
          @media (max-width: 480px) {
            :host {
              padding: 0;
              align-items: stretch;
            }
            .calculator-shell {
              max-width: 100%;
              height: 100vh;
              border-radius: 0;
              border: none;
              box-shadow: none;
            }
          }
        </style>
        <main class="calculator-shell" aria-label="StayCalc Calculator Application">
          <stay-calc-header></stay-calc-header>
          <stay-calc-display></stay-calc-display>
          <stay-calc-keypad></stay-calc-keypad>
        </main>
      </template>
    </stay-calc-app>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
